<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakerPulse</title>
<style>
  :root { --graphite: #20262c; --graphite-2: #2b333b; --green: #00ae42; --green-deep: #00862f; --green-soft: #e7f7ee;
    --fg: #1b2127; --muted: #5f6b76; --bg: #fff; --plate: #f3f5f7; --line: #e3e7eb;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow-md: 0 0 0 1px rgba(16,24,40,.05), 0 10px 24px -8px rgba(16,24,40,.22);
    --layers: repeating-linear-gradient(180deg, rgba(255,255,255,.045) 0 1px, transparent 1px 4px); }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8edf2; --muted: #9aa6b2; --bg: #1b2026; --plate: #232a31; --line: #333c45; --green-soft: rgba(0,174,66,.16);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow-md: 0 0 0 1px rgba(255,255,255,.06), 0 10px 24px -8px rgba(0,0,0,.6); } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--plate); }
  html:has(body.welcome) { background: #e9edf0; }
  body.welcome { width: min(480px, calc(100% - 32px)); margin: 40px auto; padding: 0 0 4px; font-size: 14px; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-md); }
  .band { display: flex; align-items: center; gap: 12px; padding: 16px 18px 40px; color: #fff;
    background: var(--layers), linear-gradient(180deg, var(--graphite-2), var(--graphite)); border-bottom: 3px solid var(--green); }
  .band img { width: 44px; height: 44px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
  .band h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  .band span { display: block; font-size: 12px; color: #b9c4cd; }
  .card { margin: -26px 12px 0; padding: 16px; background: var(--bg); border-radius: 16px; box-shadow: var(--shadow-md); text-align: center; position: relative; }
  .card p { margin: 0 0 8px; color: var(--muted); }
  .start { display: none; text-align: left; background: var(--green-soft); border: 1px solid rgba(0,174,66,.3); border-radius: 12px; padding: 10px 12px; margin: 4px 0 8px; color: var(--fg); }
  .welcome .start { display: block; }
  .start a { color: var(--green-deep); font-weight: 700; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--green), 0 8px 20px -6px rgba(0,0,0,.35); }
  .ask { font-weight: 700; font-size: 14px; margin: 14px 0 12px; color: var(--fg); }
  .boost { display: inline-flex; align-items: center; gap: 10px; padding: 11px 30px; border-radius: 12px; background: var(--green); color: #fff;
    font-size: 17px; font-weight: 750; text-decoration: none; box-shadow: 0 3px 0 var(--green-deep), 0 10px 22px -6px rgba(0,174,66,.55); transition: transform .08s, box-shadow .08s; }
  .boost:hover { transform: translateY(-1px); }
  .boost:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--green-deep); }
  .small { font-size: 11px; color: var(--muted); margin: 10px 0 0; }
  .social { display: flex; justify-content: center; gap: 12px; margin: 14px 0 2px; }
  .social a { display: inline-flex; width: 40px; height: 40px; align-items: center; justify-content: center; border-radius: 12px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); box-shadow: var(--shadow-sm); transition: transform .08s, border-color .08s; }
  .social a:hover { border-color: var(--green); transform: translateY(-1px); }
  .social a:focus-visible, .boost:focus-visible, summary:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .social svg { width: 20px; height: 20px; fill: currentColor; }
  .social a.mw { background: #fff; }
  .social a.mw img { width: 24px; height: 24px; }
  details { margin: 12px; background: var(--bg); border-radius: 16px; box-shadow: var(--shadow-md); padding: 0 16px; }
  summary { cursor: pointer; font-weight: 700; padding: 13px 0; list-style: none; display: flex; justify-content: space-between; }
  summary::after { content: "⌄"; color: var(--muted); }
  details[open] summary::after { content: "⌃"; }
  details[open] { padding-bottom: 14px; }
  /* interruttori */
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; cursor: pointer; border-top: 1px solid var(--line); }
  label input { appearance: none; flex: none; width: 36px; height: 20px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; order: 2; }
  label input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  label input:checked { background: var(--green); }
  label input:checked::after { transform: translateX(16px); }
  label input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  h3 { font-size: 13px; margin: 14px 0 0; }
  textarea { width: 100%; min-height: 120px; margin-top: 6px; font: 12.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--plate);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; resize: vertical; box-shadow: inset 0 1px 2px rgba(16,24,40,.06); }
  textarea:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  details p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .version { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0 12px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="band"><img src="icons/128.png" alt=""><div><h1>MakerPulse</h1><span data-t="tagline"></span></div></header>
<section class="card">
  <p data-t="thanks"></p>
  <p data-t="local"></p>
  <div class="start"><span data-t="start"></span> <a href="https://makerworld.com/en/@Emanuele_tech" target="_blank" rel="noopener" data-t="startLink"></a></div>
  <hr>
  <img class="avatar" src="images/avatar.webp" alt="Emanuele">
  <div class="ask" data-t="ask"></div>
  <a class="boost" href="https://makerworld.com/en/@Emanuele_tech/upload" target="_blank" rel="noopener">🚀 Boost</a>
  <p class="small" data-t="boostNote"></p>
  <div class="social">
    <a href="https://makerworld.com/en/@Emanuele_tech" target="_blank" rel="noopener" title="MakerWorld" class="mw"><img src="images/makerworld.png" alt="MakerWorld">
    </a>
    <a href="https://www.instagram.com/emanuele_tech" target="_blank" rel="noopener" title="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm5.25-3.75a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z"/></svg>
    </a>
    <a href="https://github.com/emanueletech/makerpulse" target="_blank" rel="noopener" title="GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57l-.02-2.04c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.62-5.48 5.92.42.36.81 1.1.81 2.22l-.01 3.29c0 .32.21.69.82.57A12 12 0 0 0 12 .3"/></svg>
    </a>
  </div>
</section>
<details id="settings">
  <summary data-t="settings"></summary>
  <label><input type="checkbox" id="modelPanel"> <span data-t="modelPanel"></span></label>
  <label><input type="checkbox" id="profilePanel"> <span data-t="profilePanel"></span></label>
  <label><input type="checkbox" id="pointsPanel"> <span data-t="pointsPanel"></span></label>
  <label><input type="checkbox" id="quickReplies"> <span data-t="quickReplies"></span></label>
  <label><input type="checkbox" id="collapsed"> <span data-t="collapsed"></span></label>
  <h3 data-t="repliesTitle"></h3>
  <textarea id="replies" spellcheck="true"></textarea>
  <p data-t="repliesHint"></p>
  <p data-t="note"></p>
</details>
<div class="version"></div>
<script src="replies.js"></script>
<script src="popup.js"></script>
</body>
</html>
