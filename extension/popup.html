<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakerPulse</title>
<style>
  :root { --fg: #1f2328; --muted: #59636e; --bg: #fff; --card: #f6f8fa; --line: #d8dee4; --green: #00ae42; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #9198a1; --bg: #1c2128; --card: #22272e; --line: #444c56; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
  body.welcome { width: auto; max-width: 460px; margin: 40px auto; padding: 0 16px; font-size: 14px; }
  .about { text-align: center; padding: 18px 18px 6px; }
  .logo { width: 56px; height: 56px; }
  h1 { font-size: 20px; margin: 4px 0 10px; }
  .about p { margin: 0 0 8px; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid var(--green); }
  .ask { color: var(--green); font-weight: 700; margin: 10px 0 12px; }
  .boost { display: inline-flex; align-items: center; gap: 10px; padding: 9px 26px; border-radius: 12px; background: var(--green); color: #fff;
    font-size: 17px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 14px rgba(0, 174, 66, .35); transition: transform .1s; }
  .boost:hover { transform: translateY(-1px); }
  .small { font-size: 11px; color: var(--muted); margin: 8px 0 0; }
  .social { display: flex; justify-content: center; gap: 14px; margin: 14px 0 6px; }
  .social a { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; border-radius: 50%; background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  .social a:hover { border-color: var(--green); color: var(--green); }
  .social svg { width: 18px; height: 18px; fill: currentColor; }
  .social a.mw { background: #fff; }
  .social a.mw img { width: 22px; height: 22px; }
  details { border-top: 1px solid var(--line); padding: 0 16px 12px; }
  summary { cursor: pointer; font-weight: 700; padding: 10px 0 6px; }
  label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
  h3 { font-size: 12px; margin: 10px 0 0; }
  textarea { width: 100%; min-height: 110px; margin-top: 4px; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px; resize: vertical; }
  details p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .start { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0 4px; color: var(--fg); }
  .welcome .start { display: block; }
  .start a { color: var(--green); font-weight: 700; }
  .version { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0 12px; }
</style>
</head>
<body>
<section class="about">
  <img class="logo" src="icons/128.png" alt="">
  <h1>MakerPulse</h1>
  <p data-t="thanks"></p>
  <p data-t="local"></p>
  <div class="start"><span data-t="start"></span> <a href="https://makerworld.com/en/@Emanuele_tech" target="_blank" rel="noopener" data-t="startLink"></a></div>
  <hr>
  <img class="avatar" src="images/avatar.webp" alt="Emanuele">
  <div class="ask" data-t="ask"></div>
  <a class="boost" href="https://makerworld.com/en/@Emanuele_tech/upload" target="_blank" rel="noopener">🚀 Boost</a>
  <p class="small" data-t="boostNote"></p>
  <div class="social">
    <a href="https://makerworld.com/en/@Emanuele_tech" target="_blank" rel="noopener" title="MakerWorld" class="mw"><img src="images/makerworld.png" alt="MakerWorld">
    </a>
    <a href="https://www.instagram.com/emanuele_tech" target="_blank" rel="noopener" title="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm5.25-3.75a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z"/></svg>
    </a>
    <a href="https://github.com/emanueletech/makerpulse" target="_blank" rel="noopener" title="GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57l-.02-2.04c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.62-5.48 5.92.42.36.81 1.1.81 2.22l-.01 3.29c0 .32.21.69.82.57A12 12 0 0 0 12 .3"/></svg>
    </a>
  </div>
</section>
<details id="settings">
  <summary data-t="settings"></summary>
  <label><input type="checkbox" id="modelPanel"> <span data-t="modelPanel"></span></label>
  <label><input type="checkbox" id="profilePanel"> <span data-t="profilePanel"></span></label>
  <label><input type="checkbox" id="pointsPanel"> <span data-t="pointsPanel"></span></label>
  <label><input type="checkbox" id="quickReplies"> <span data-t="quickReplies"></span></label>
  <label><input type="checkbox" id="collapsed"> <span data-t="collapsed"></span></label>
  <h3 data-t="repliesTitle"></h3>
  <textarea id="replies" spellcheck="true"></textarea>
  <p data-t="repliesHint"></p>
  <p data-t="note"></p>
</details>
<div class="version"></div>
<script src="replies.js"></script>
<script src="popup.js"></script>
</body>
</html>
